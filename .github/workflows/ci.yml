# CI: the publish gate for main (job `checks`). Every check here must pass before a
# change may be merged and published to https://aakash-tir.github.io/.
# See .claude/rules/merge-to-main.md.
#
# Kept lean on Actions minutes: pull requests only (the merge to main re-runs nothing,
# the PR already tested it), and only when a file this check depends on changed.
# Docs-only changes (docs/, logs/, graphify-out/, *.md, .claude/) run no CI at all. Run
# it by hand from the Actions tab (workflow_dispatch) when needed.
#
# `checks` is a REQUIRED status check on main, so a PR that runs no CI cannot merge
# until it has one: for a docs-only PR, dispatch it on the branch
# (`gh workflow run ci.yml --ref <branch>`).
name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'images/**'
      - '*.pdf'
      - 'scripts/**'
      - '.htmlvalidate.json'
      - '.stylelintrc.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS syntax check
        run: |
          for f in $(find js -name '*.js'); do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Publish readiness (asset integrity + no TEMP placeholders)
        run: node scripts/checks/verify.mjs

      - name: HTML validation
        run: npx --yes html-validate@8 index.html

      - name: CSS lint
        run: npx --yes stylelint@16 "css/**/*.css"
